<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stashov Palace — Memory in 3D</title>
<link rel="icon" href="data:,">
<style>
  @font-face {
    font-family: "Departure Mono";
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url("/fonts/DepartureMono-Regular.woff2") format("woff2");
  }
  :root {
    --ink: #2b2115;
    --dim: #6b5a41;
    --gold: #9a7422;
    --panel: #f7efdb;
    --line: rgba(74, 54, 32, 0.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a120a; color: var(--ink);
    font-family: "Departure Mono", ui-monospace, Consolas, monospace; }
  #scene { position: fixed; inset: 0; display: block; touch-action: none; }
  #veil { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #1a120a; z-index: 30; transition: opacity 0.5s ease; }
  #veil.hidden { opacity: 0; pointer-events: none; }
  #veil p { color: #d8c493; letter-spacing: 0.2em; text-transform: uppercase; font-size: 13px; animation: veilPulse 1.6s ease-in-out infinite; }
  @keyframes veilPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; gap: 12px;
    align-items: center; padding: 10px 14px; pointer-events: none; }
  #topbar .brand { font-weight: 700; letter-spacing: 0.08em; color: #f7efdb; text-shadow: 2px 2px 0 rgba(0,0,0,.45); }
  #topbar .brand small { color: #e7c979; font-weight: 400; }
  #topbar a { pointer-events: auto; color: var(--ink); text-decoration: none; border: 1px solid var(--line);
    border-radius: 3px; padding: 6px 12px; background: var(--panel); font-size: 13px;
    box-shadow: 2px 2px 0 rgba(0,0,0,.35); transition: transform .15s, box-shadow .15s; }
  #topbar a:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 rgba(0,0,0,.35); }
  #topbar a:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 rgba(0,0,0,.35); }
  #topbar .hint { margin-left: auto; color: #d8c493; font-size: 12px; text-shadow: 1px 1px 0 rgba(0,0,0,.5); }
  #demoBtn { pointer-events: auto; margin-left: 10px; background: #3d6b4c; color: #fff8e6; border: 1px solid #241708;
    border-radius: 3px; padding: 6px 12px; font-size: 13px; font-family: inherit; cursor: pointer;
    box-shadow: 2px 2px 0 rgba(0,0,0,.35); transition: transform .15s, box-shadow .15s; }
  #demoBtn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 rgba(0,0,0,.35); }
  #demoBtn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 rgba(0,0,0,.35); }
  #panel .narrate { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 14px; line-height: 1.55; color: #4a3823; }
  #panel { position: fixed; z-index: 20; right: 12px; top: 56px; width: min(330px, calc(100vw - 24px));
    max-height: calc(100vh - 120px); overflow: auto; background:
    repeating-linear-gradient(0deg, transparent 0 27px, rgba(49,81,126,.05) 27px 28px), var(--panel);
    border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px;
    box-shadow: 5px 6px 0 rgba(0,0,0,.35); animation: panelIn .35s cubic-bezier(.22,1,.36,1) both; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  #panel h2 { margin: 0 0 4px; font-size: 16px; }
  #panel .sub { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  #panel ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
  #panel li { margin: 3px 0; }
  #panel .pill { display: inline-block; font-size: 11px; border: 1.5px solid var(--gold); border-radius: 3px;
    padding: 1px 8px; margin-left: 6px; color: var(--gold); transform: rotate(-1deg); }
  #panel button { position: sticky; bottom: 0; margin-top: 10px; width: 100%; background: #3d6b4c; color: #fff8e6;
    border: 1px solid #241708; border-radius: 3px; padding: 7px; font-size: 13px; cursor: pointer;
    font-family: inherit; box-shadow: 2px 2px 0 rgba(0,0,0,.3); transition: transform .15s, box-shadow .15s; }
  #panel button:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 rgba(0,0,0,.3); }
  #panel button:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 rgba(0,0,0,.3); }
  #errbox { position: fixed; z-index: 40; left: 12px; bottom: 12px; right: 12px; display: none;
    background: #f6ddd2; color: #7a2d20; border: 1px solid #a83c2a; border-radius: 4px; padding: 10px 14px; font-size: 13px;
    box-shadow: 4px 5px 0 rgba(0,0,0,.3); }
  .hint-phone { display: none; }
  @media (max-width: 640px) {
    #topbar { gap: 8px; padding: 8px 10px; flex-wrap: nowrap; }
    #topbar a, #demoBtn { white-space: nowrap; padding: 5px 8px; font-size: 12px; margin-left: 0; flex: none; }
    #topbar .brand { display: none; }
    #topbar .hint { display: none; }
    #topbar .hint-phone { display: block; margin-left: auto; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #panel { top: auto; bottom: 12px; right: 12px; max-height: 38vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    #veil p, #panel { animation: none; }
    #topbar a, #panel button { transition-duration: 1ms; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="veil"><p>Raising the palace…</p></div>
<div id="topbar">
  <a href="/">&#8592; Vault</a>
  <div class="brand">STASHOV <small>Palace</small></div>
  <div class="hint">drag to orbit &middot; scroll to zoom &middot; click a wing &middot; Esc resets</div>
  <div class="hint hint-phone">drag to orbit &middot; tap a wing</div>
  <button id="demoBtn" type="button">&#9654; Play demo</button>
</div>
<aside id="panel" aria-live="polite"></aside>
<div id="errbox" role="alert"></div>
<script type="module" src="/palace.js"></script>
</body>
</html>
